# Local development stack. Run: docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: reliablepay
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reliablepay"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  mock-bank:
    build: ./backend/mock-bank
    environment:
      PORT: 8081
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: reliablepay
      DB_USER: postgres
      DB_PASSWORD: postgres
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      JAVA_TOOL_OPTIONS: "-Xmx512m -XX:MaxMetaspaceSize=256m"
    ports: ["8081:8081"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      db: { condition: service_healthy }
  payment-service:
    build: ./backend/payment-service
    environment:
      PORT: 8080
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: reliablepay
      DB_USER: postgres
      DB_PASSWORD: postgres
      MOCK_BANK_URL: http://mock-bank:8081
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:4173}
      ADMIN_RESET_ENABLED: "true"
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      REDIS_ENABLED: "false"
      JAVA_TOOL_OPTIONS: "-Xmx512m -XX:MaxMetaspaceSize=256m"
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      db: { condition: service_healthy }
      mock-bank: { condition: service_healthy }
volumes:
  pgdata:
