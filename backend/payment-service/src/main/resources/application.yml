server:
  port: ${PORT:8080}
spring:
  application:
    name: payment-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:${JDBC_DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:reliablepay}}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    fail-on-missing-locations: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
app:
  mock-bank-url: ${BANK_BASE_URL:${MOCK_BANK_URL:http://localhost:8081}}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  redis-enabled: ${REDIS_ENABLED:false}
  admin-reset-enabled: ${ADMIN_RESET_ENABLED:true}
  admin-token: ${ADMIN_TOKEN:}
  bank:
    read-timeout-ms: ${BANK_READ_TIMEOUT_MS:2000}
    connect-timeout-ms: ${BANK_CONNECT_TIMEOUT_MS:1000}
  retry:
    max-attempts: ${RETRY_MAX_ATTEMPTS:4}
    base-delay-ms: ${RETRY_BASE_DELAY_MS:500}
    multiplier: ${RETRY_MULTIPLIER:2.0}
    max-delay-ms: ${RETRY_MAX_DELAY_MS:8000}
    poll-interval-ms: ${RETRY_POLL_INTERVAL_MS:1000}
  reconcile:
    enabled: ${RECONCILE_ENABLED:true}
    grace-ms: ${RECONCILE_GRACE_MS:6000}
    poll-interval-ms: ${RECONCILE_POLL_INTERVAL_MS:2000}
  idempotency:
    ttl-hours: 24
  experiment:
    wait-timeout-ms: ${EXPERIMENT_WAIT_TIMEOUT_MS:90000}
